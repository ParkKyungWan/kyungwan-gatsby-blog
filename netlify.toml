[build]
  command = "npm run build"
  publish = "public"

[build.environment]
  NODE_VERSION = "22.23.4"
  NPM_VERSION = "10.9.4"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs", "gray-matter", "js-yaml", "sharp"]

[[redirects]]
  from = "/api/write/*"
  to = "/.netlify/functions/writer/:splat"
  status = 200
  force = true
